<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imperial March</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at center, #181818 0%, #050505 45%, #000000 100%);
        color: white;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    .container {
        width: 90%;
        max-width: 500px;
        text-align: center;
    }

    .imperial {
        font-size: 14px;
        letter-spacing: 8px;
        color: #999;
        margin-bottom: 20px;
        text-transform: uppercase;
    }

    h1 {
        margin: 0;
        font-size: clamp(42px, 12vw, 72px);
        letter-spacing: 5px;
        font-weight: 800;
        text-shadow:
            0 0 8px #ff0000,
            0 0 25px rgba(255,0,0,0.45);
    }

    .line {
        width: 100%;
        height: 2px;
        margin: 28px auto;
        background: linear-gradient(
            90deg,
            transparent,
            #ff0000,
            transparent
        );
        box-shadow: 0 0 12px #ff0000;
    }

    .subtitle {
        color: #aaa;
        font-size: 14px;
        letter-spacing: 3px;
        margin-bottom: 35px;
        text-transform: uppercase;
    }

    .audio-box {
        padding: 18px;
        border: 1px solid #333;
        border-radius: 12px;
        background: rgba(15,15,15,0.9);
        box-shadow:
            0 0 25px rgba(255,0,0,0.15),
            inset 0 0 20px rgba(255,255,255,0.02);
    }

    audio {
        width: 100%;
    }

    .vader {
        margin-top: 35px;
        font-size: 12px;
        letter-spacing: 6px;
        color: #555;
    }

    .red {
        color: #d00000;
    }
</style>
</head>

<body>

<div class="container">

    <div class="imperial">
        Galactic Empire
    </div>

    <h1>IMPERIAL<br><span class="red">MARCH</span></h1>

    <div class="line"></div>

    <div class="subtitle">
        Darth Vader's Theme
    </div>

    <div class="audio-box">
        <audio controls autoplay>
            <source src="Star Wars- The Imperial March (Darth Vader's Theme).mp3" type="audio/mpeg">
            Tu navegador no puede reproducir este audio.
        </audio>
    </div>

    <div class="vader">
        DARK SIDE
    </div>

</div>

</body>
</html>
